name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The app links cpal (ALSA on Linux) and eframe (X11/Wayland/GL). The library
      # crates need none of this, which is why the split matters, but `cargo test
      # --workspace` builds the binary and so does need it.
      - name: Install audio and window system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libwayland-dev

      # The DSP fixtures are generated, not committed (tools/fixtures/out is
      # gitignored), so the comparison test needs the generator to run first. It is
      # numpy/scipy only, which is exactly why the fixtures can be checked in CI with
      # no torch and no GPU.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture generator dependencies
        run: python3 -m pip install --quiet numpy scipy

      - name: Generate scipy fixtures
        run: python3 tools/fixtures/gen.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The tests are the evidence that the port matches scipy; run them after lint so
      # a style failure does not hide a numeric one, and with the fixtures present so
      # the comparison cannot silently skip.
      - name: Test
        run: |
          test -f tools/fixtures/out/manifest.json
          cargo test --workspace --all-targets

  python-tools:
    name: spike tooling parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The export needs torch and weights, which CI has neither of. This only proves
      # the tools are importable and their arguments parse, so `--help` cannot rot.
      - name: Byte-compile the tools
        run: python3 -m py_compile tools/*.py tools/fixtures/gen.py

  windows:
    name: build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The fixture-dependent test compares the Rust DSP against scipy goldens, so the
      # generator has to run here too; numpy/scipy have Windows wheels, which is the
      # whole reason the fixtures are generated rather than committed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture generator dependencies
        run: python -m pip install --quiet numpy scipy

      - name: Generate scipy fixtures
        run: python tools/fixtures/gen.py

      - name: Check formatting
        run: cargo fmt --all --check

      # No audio device and no window system on a runner, but everything compiles, the
      # portable modules' tests run, and the Python sidecar is exercised against its
      # fake worker. This is the Windows half of "the core is portable".
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: |
          if (-not (Test-Path tools/fixtures/out/manifest.json)) { throw "fixtures missing" }
          cargo test --workspace --all-targets

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
