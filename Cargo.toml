[workspace]
resolver = "2"
members = ["crates/core", "crates/infer", "crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/gabriel-rivero/flacify"
# Application workspace: none of the three crates is published, so cargo-deny may
# accept their path dependencies without version requirements.
publish = false

[workspace.dependencies]
flacify-core = { path = "crates/core" }
flacify-infer = { path = "crates/infer" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
realfft = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The DSP tests run seconds of audio through a polyphase resampler and an eighth-order
# filter; unoptimised that is minutes, so optimise the test profile. Release is what
# matters for throughput, this is only about not making `cargo test` unusable.
[profile.test]
opt-level = 2
