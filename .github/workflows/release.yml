name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: windows (exe + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release --bin flacify

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc packaging\flacify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/flacify.exe
            target/release/flacify-setup.exe

  macos:
    name: macos (app + dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release --bin flacify

      - name: Bundle the app and make the dmg
        run: |
          APP=target/release/Flacify.app
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/flacify "$APP/Contents/MacOS/flacify"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>flacify</string>
            <key>CFBundleDisplayName</key><string>flacify</string>
            <key>CFBundleIdentifier</key><string>com.gabrielrivero.flacify</string>
            <key>CFBundleVersion</key><string>0.4.0</string>
            <key>CFBundleShortVersionString</key><string>0.4.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>flacify</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/flacify"
          hdiutil create -volname flacify -srcfolder "$APP" -ov -format UDZO target/release/flacify.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/flacify.dmg

  linux:
    name: linux (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install audio and window system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libwayland-dev

      - name: Build the release binary
        run: cargo build --release --bin flacify

      - name: Build the .deb
        run: |
          VERSION=0.4.0
          ROOT=target/deb
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp target/release/flacify "$ROOT/usr/bin/flacify"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: flacify
          Version: $VERSION
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Gabriel Rivero <gabriel.rivero.sa@gmail.com>
          Depends: libasound2 | libasound2t64, libx11-6, libxcursor1, libxrandr2, libxi6, libxinerama1, libxkbcommon0, libwayland-client0
          Description: A desktop player that reconstructs the high frequencies lossy audio threw away.
          EOF
          cat > "$ROOT/usr/share/applications/flacify.desktop" <<'EOF'
          [Desktop Entry]
          Name=flacify
          Exec=flacify play %f
          Type=Application
          Categories=AudioVideo;Audio;Player;
          MimeType=audio/mpeg;audio/flac;audio/x-wav;audio/ogg;audio/mp4;
          EOF
          dpkg-deb --build "$ROOT" "target/release/flacify_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/flacify_0.4.0_amd64.deb

  publish:
    name: publish the release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            flacify 0.4.0: the cache is a set of FLAC segments, and playback reads them.

            - **Windows:** `flacify-setup.exe` (per-user install, Start Menu shortcut) or the raw `flacify.exe`.
            - **macOS:** `flacify.dmg` with `Flacify.app`. Nothing is signed yet; right-click, then Open,
              or run `xattr -dr com.apple.quarantine /Applications/Flacify.app`.
            - **Linux:** `flacify_0.4.0_amd64.deb` (unsigned).

            A render is now written as 24-bit FLAC segments, each written and readable as soon
            as it finishes, so an interrupted render resumes instead of starting over. A track
            with a complete cache entry plays from three resident segments: 66 MB for an hour
            of audio instead of 1.38 GB per buffer, and seeking is a segment read. The first
            play of an uncached track still holds the whole track in memory, and cached
            playback draws no waveform or spectrum until the UI work lands.

            `flacify enhance in.mp3 -o out.flac` writes 24-bit FLAC as well as WAV. The first
            `flacify play` still opens a setup screen and downloads the Python sidecar, wheels
            and weights (about 6.9 GB with CUDA, 4.2 GB without); a full-band file or a cached
            render plays without the model.
