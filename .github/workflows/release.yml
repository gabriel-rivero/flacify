name: release

on:
  push:
    tags: ["v*"]
  # A dry run builds every artifact under the version you name, without publishing.
  # Use it from the Actions tab on a branch before the tag exists.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must equal the workspace version in Cargo.toml)
        required: true
        default: "1.1.3"

permissions:
  contents: write

jobs:
  version:
    name: version is single-sourced
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read Cargo.toml and check it against the tag
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$VERSION" || { echo "no workspace version in Cargo.toml"; exit 1; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.version }}" = "$VERSION" || {
              echo "dry run asked for ${{ inputs.version }}, Cargo.toml says $VERSION"
              exit 1
            }
          elif [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION"

  windows:
    name: windows (exe + installer)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release --bin flacify

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.value }}" packaging\flacify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/flacify.exe
            target/release/flacify-setup.exe

  macos:
    name: macos (app + dmg)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release --bin flacify

      - name: Bundle the app and make the dmg
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          APP=target/release/Flacify.app
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/flacify "$APP/Contents/MacOS/flacify"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>flacify</string>
            <key>CFBundleDisplayName</key><string>flacify</string>
            <key>CFBundleIdentifier</key><string>com.gabrielrivero.flacify</string>
            <key>CFBundleVersion</key><string>__VERSION__</string>
            <key>CFBundleShortVersionString</key><string>__VERSION__</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>flacify</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>flacify captures the audio you route to it, enhances it, and sends it to the output device you chose.</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__VERSION__/${VERSION}/g" "$APP/Contents/Info.plist"
          grep -q "<string>${VERSION}</string>" "$APP/Contents/Info.plist" || { echo "plist did not take $VERSION"; exit 1; }
          chmod +x "$APP/Contents/MacOS/flacify"
          hdiutil create -volname flacify -srcfolder "$APP" -ov -format UDZO target/release/flacify.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/flacify.dmg

  linux:
    name: linux (deb)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install audio and window system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libwayland-dev

      - name: Build the release binary
        run: cargo build --release --bin flacify

      - name: Build the .deb and the tarball the Arch package installs
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          ROOT=target/deb
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          cp target/release/flacify "$ROOT/usr/bin/flacify"
          cp packaging/flacify.desktop "$ROOT/usr/share/applications/flacify.desktop"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: flacify
          Version: $VERSION
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Gabriel Rivero <gabriel.rivero.sa@gmail.com>
          Depends: libasound2 | libasound2t64, libx11-6, libxcursor1, libxrandr2, libxi6, libxinerama1, libxkbcommon0, libwayland-client0
          Description: A desktop player that reconstructs the high frequencies lossy audio threw away.
          EOF
          dpkg-deb --build "$ROOT" "target/release/flacify_${VERSION}_amd64.deb"

          # One tarball for the Arch package: the binary, the desktop entry and the licence.
          STAGE=$(mktemp -d)
          cp target/release/flacify "$STAGE/"
          cp packaging/flacify.desktop LICENSE "$STAGE/"
          tar -czf "target/release/flacify-${VERSION}-x86_64.tar.gz" -C "$STAGE" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/flacify_${{ needs.version.outputs.value }}_amd64.deb
            target/release/flacify-${{ needs.version.outputs.value }}-x86_64.tar.gz

  arch:
    name: arch (pacman package)
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      # pacman 7's sandbox needs user namespaces the runner does not offer.
      - name: Install the build and runtime packages
        run: |
          pacman -Syu --noconfirm --disable-sandbox --quiet --needed \
            base-devel alsa-lib libglvnd libx11 libxcursor libxrandr libxi \
            libxinerama libxkbcommon wayland fontconfig
          useradd -m builder

      - name: Build the package
        run: |
          VERSION="${{ needs.version.outputs.value }}"
          TARBALL="artifacts/flacify-${VERSION}-x86_64.tar.gz"
          test -f "$TARBALL"
          SUM=$(sha256sum "$TARBALL" | cut -d" " -f1)
          cp packaging/PKGBUILD /home/builder/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/; s/^sha256sums=.*/sha256sums=(\"${SUM}\")/" /home/builder/PKGBUILD
          cp "$TARBALL" /home/builder/
          chown -R builder:builder /home/builder
          # The tarball is already here, so makepkg takes it from SRCDEST instead of the
          # release URL, which does not exist until this run publishes.
          su builder -c "cd /home/builder && SRCDEST=/home/builder makepkg --noconfirm --nocheck --nodeps"
          cp /home/builder/*.pkg.tar.zst .

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: "*.pkg.tar.zst"

  publish:
    name: publish the release
    needs: [version, windows, macos, linux, arch]
    # A manual run builds and uploads artifacts only; publishing is the tag's job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            flacify ${{ needs.version.outputs.value }}: a YouTube track that would not play, now plays.

            **The FLAC writer was producing unreadable segments on some tracks.** One real 236 s
            track failed with "src-000001.flac holds 1380224 frames, source.json says 1384320", and
            the cause was the encoder, not the decoder or the source tier: `flacenc` 0.5.1 drops a
            whole frame on some inputs, and which block size trips it depends on the data. At the
            crate's default block 4096 that track lost 4096 frames and wrote 33.6 MB of stream that
            decodes to nothing; 3456 lost a frame on another segment, 3072 on another. 2304 and
            below were exact on all nine segments.

            So the block size is now 2304, and **the writer decodes every segment back and refuses
            to accept one whose frame count disagrees**. The second part is the real fix: a wrong
            block size is one encoder bug, but no track should ever be built from a segment that
            cannot be read.

            If you tried a URL in 1.1.1 or 1.1.2 and saw a frame-count error, re-fetching or playing
            it again with this build rebuilds the source tier correctly. The old cache directory
            names the path; deleting it forces a rebuild, and the new build will not create a bad
            one.

            - **Windows:** `flacify-setup.exe` (per-user install, Start Menu shortcut) or the raw `flacify.exe`.
            - **macOS:** `flacify.dmg` with `Flacify.app`. Nothing is signed yet; right-click, then Open,
              or run `xattr -dr com.apple.quarantine /Applications/Flacify.app`.
            - **Linux:** `flacify_${{ needs.version.outputs.value }}_amd64.deb` for Debian and Ubuntu, or
              `flacify-bin-${{ needs.version.outputs.value }}-1-x86_64.pkg.tar.zst` for Arch (`pacman -U`).

            Everything from 1.1.2 is unchanged: the app still installs its own `yt-dlp`, and a URL
            still needs no `ffmpeg`.

            The weights are the FlashSR author's and carry no stated licence. The app downloads them
            at first run, bundles and redistributes nothing, and this project's MIT licence covers its
            own code only. A full-band file or an already-cached render plays without the model.
